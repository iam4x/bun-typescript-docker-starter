name: Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

      - name: Run format check
        run: bun fmt --check

      - name: Run type check
        run: bun check

      - name: Run lint
        run: bun run lint

      - name: Run build
        run: bun run build

      - name: Run SPA build
        run: bun run build:spa

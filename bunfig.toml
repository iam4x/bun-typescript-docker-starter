[install]
minimumReleaseAge = 172800

[test]
pathIgnorePatterns = ["**/*.test.tsx"]

[fmt]
printWidth = 80
ignorePatterns = ["node_modules", "dist"]

[fmt.sortImports]
newlinesBetween = true
sortSideEffects = true
customGroups = [
  { groupName = "internal-alias", elementNamePattern = ["~", "~/**"] },
]
groups = [
  "type-import",
  "value-builtin",
  "value-external",
  "internal-alias",
  "value-internal",
  ["value-sibling", "value-index"],
  { newlinesBetween = false },
  "value-parent",
  "unknown",
]

[[fmt.overrides]]
files = ["**/*.json", "**/*.jsonc"]
options = { trailingComma = "none" }
